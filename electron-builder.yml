# Step On Chord — electron-builder 配置（NSIS 安装包）
# 构建入口：scripts/build-installer.ps1（先 npm run build 再打安装包）

appId: com.donokey.steponchord
productName: Step On Chord
copyright: Copyright © 2026 donokey

directories:
  output: release
  buildResources: build

# better-sqlite3 v13 为 Node-API 模块，npm 包自带 win32-x64 预编译二进制，
# Electron 下可直接加载，无需 node-gyp 重编译（本机无 Visual Studio）
npmRebuild: false

# 渲染进程产物 + 主进程/preload 产物；dependencies 由 electron-builder 自动收集进 asar
files:
  - dist/**
  - dist-electron/**

# better-sqlite3 为原生模块，.node 二进制必须在 asar 外才能加载
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# 额外资源：只带 PyInstaller 产物（内含 engine-data 运行时代码与 model-sources.json 配置），
# 不带 models/（权重首启下载）、ffmpeg、test-audio
extraResources:
  - from: resources/python-backend
    to: python-backend
  - from: resources/model-sources.json
    to: model-sources.json

win:
  # 使用 Electron 默认图标（用户偏好，2026-08-10 决定）；build/icon.ico 不再引用
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Step On Chord
  artifactName: ${name}-${version}-setup.${ext}

# 应用内自动更新（electron-updater）：以 GitHub Releases 为更新源，
# electron-builder 构建时自动生成 latest.yml + blockmap（差分更新必需）
publish:
  provider: github
  owner: donokey
  repo: Step-On-Chord
